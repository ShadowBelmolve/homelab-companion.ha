[project]
name = "redondo-ha"
version = "0.1.0"
description = "Home Assistant integration for the Redondo Companion."
requires-python = ">=3.14.2"

[dependency-groups]
# Pins homeassistant itself: the plugin tracks one exact release.
# noiseprotocol: the integration's requirement, which Home Assistant installs by itself.
dev = ["pytest-homeassistant-custom-component==0.13.375", "noiseprotocol==0.3.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: starts a real Home Assistant container (slow, needs docker)"]
addopts = "-m 'not live'"
